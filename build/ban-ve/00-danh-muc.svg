ext x="65" y="632" text-anchor="start" font-size="10" fill="#1a1a1a">Chốt draw-bore góc thân</text><text x="319" y="632" text-anchor="end" font-size="10" fill="#1a1a1a">8</text><text x="330" y="632" text-anchor="start" font-size="10" fill="#1a1a1a">Ø5 × 22</text><text x="590" y="632" text-anchor="start" font-size="10" fill="#1a1a1a">cocobolo</text><text x="740" y="632" text-anchor="start" font-size="10" fill="#1a1a1a">lệch tâm 0,4 mm</text><line x1="60" y1="637.0" x2="1060" y2="637.0" stroke="#dcd8d0" stroke-width="0.7"/><text x="65" y="651" text-anchor="start" font-size="10" fill="#1a1a1a">Nam châm khối</text><text x="319" y="651" text-anchor="end" font-size="10" fill="#1a1a1a">8</text><text x="579" y="651" text-anchor="end" font-size="10" fill="#1a1a1a">20 × 5 × 5</text><text x="590" y="651" text-anchor="start" font-size="10" fill="#1a1a1a">NdFeB N45, ma Ni</text><text x="740" y="651" text-anchor="start" font-size="10" fill="#1a1a1a">phân cực theo bề dày</text><line x1="60" y1="656.0" x2="1060" y2="656.0" stroke="#dcd8d0" stroke-width="0.7"/><rect x="60" y="352" width="1000" height="304" fill="none" stroke="#b8b5ae" stroke-width="0.7"/><line x1="270.0" y1="352" x2="270.0" y2="656" stroke="#dcd8d0" stroke-width="0.7"/><line x1="325.0" y1="352" x2="325.0" y2="656" stroke="#dcd8d0" stroke-width="0.7"/><line x1="585.0" y1="352" x2="585.0" y2="656" stroke="#dcd8d0" stroke-width="0.7"/><line x1="735.0" y1="352" x2="735.0" y2="656" stroke="#dcd8d0" stroke-width="0.7"/><text x="1100" y="114" font-size="13" font-weight="bold" fill="#1a1a1a">QUY ƯỚC CHUNG</text><text x="1100" y="138" font-size="10.5" fill="#1a1a1a">Đơn vị mm. Góc chiếu thứ nhất.</text><text x="1100" y="155" font-size="10.5" fill="#1a1a1a">Dung sai chung ±0,3 nếu không ghi khác.</text><text x="1100" y="172" font-size="10.5" fill="#1a1a1a">Mọi cao độ Z đo từ MẶT ĐÁY NGOÀI (chuẩn A),</text><text x="1100" y="189" font-size="10.5" fill="#1a1a1a">không đo từ vành.</text><text x="1100" y="206" font-size="10.5" fill="#1a1a1a">Chuẩn X = mặt ngoài vách bản lề trái (B).</text><text x="1100" y="223" font-size="10.5" fill="#1a1a1a">Chuẩn Y = mặt ngoài vách trước (C).</text><text x="1100" y="240" font-size="10.5" fill="#1a1a1a">Cạnh lộ ra bo R0,5 nếu không ghi khác.</text><text x="1100" y="257" font-size="10.5" fill="#1a1a1a">Keo: epoxy 2 thành phần cho mọi mối mộng</text><text x="1100" y="274" font-size="10.5" fill="#1a1a1a">cocobolo; lau acetone và ép trong 15 phút</text><text x="1100" y="291" font-size="10.5" fill="#1a1a1a">kể từ khi phay xong má mộng.</text><text x="1100" y="308" font-size="10.5" fill="#1a1a1a">KHÔNG một chi tiết kim loại nào trong bản lề.</text><text x="1100" y="325" font-size="10.5" fill="#1a1a1a">Nam châm chỉ dùng cho khoá nắp.</text><text x="1100" y="364" font-size="13" font-weight="bold" fill="#1a1a1a">NGUỒN SỐ</text><text x="1100" y="386" font-size="10.5" fill="#1a1a1a">tools/box_spec.py — nguồn sự thật duy nhất</text><text x="1100" y="403" font-size="10.5" fill="#1a1a1a">tools/grip_hook.py — trần hốc âm</text><text x="1100" y="420" font-size="10.5" fill="#1a1a1a">tools/hinge_kinematics.py — bản lề</text><text x="1100" y="437" font-size="10.5" fill="#1a1a1a">tools/lid_solid_calc.py — nắp, tấm nâng</text><text x="1100" y="454" font-size="10.5" fill="#1a1a1a">tools/lid_latch.py — khoá nam châm</text><text x="1100" y="471" font-size="10.5" fill="#1a1a1a">tools/drawings.py — chính bộ bản vẽ này</text><text x="1100" y="488" font-size="10.5" fill="#55524b"></text><text x="1100" y="505" font-size="10.5" fill="#55524b">Mọi trị số trên các tờ sau đều do script sinh.</text><text x="1100" y="522" font-size="10.5" fill="#55524b">Sửa số bằng tay là sai quy trình.</text><rect x="990" y="919" width="567" height="174" fill="#fff" stroke="#1a1a1a" stroke-width="1.1"/><line x1="990" y1="941" x2="1557" y2="941" stroke="#1a1a1a" stroke-width="0.7"/><text x="998" y="935" font-size="11" font-weight="bold" fill="#1a1a1a">HỘP MAHJONG 152 QUÂN — BURLORA</text><text x="998" y="963