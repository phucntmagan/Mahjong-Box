<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="DejaVu Sans" font-size="11.5"><rect width="100%" height="100%" fill="#faf9f6"/><text x="28" y="32" font-size="15.5" font-weight="bold">HÌNH 4 — Chốt xoay 1/4 vòng: chi tiết duy nhất chuyển động</text><text x="28" y="52" fill="#55524b">Không lò xo, không ren, không kim loại. Lưỡi ngang tì lên mặt dưới bản mặt trụ: ứng suất cắt 0,84 MPa trên giới hạn ~14 MPa — hệ số 15×.</text><text x="28" y="68" fill="#55524b">Điểm yếu thật là MÒN sau 5.000 chu kỳ, không phải bền tức thời → lót ổ bằng gỗ cực cứng (grenadille/lignum) và bôi sáp vi tinh thể.</text><rect x="88" y="96" width="300" height="392" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="94" y="111" font-size="11" font-weight="bold" fill="#55524b">A · THẢ — lưỡi trùng khe, rút chốt được</text><rect x="402" y="96" width="300" height="392" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="408" y="111" font-size="11" font-weight="bold" fill="#55524b">B · KHÓA — xoay 90°, lưỡi tì dưới bản mặt</text><rect x="716" y="96" width="196" height="362" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="722" y="111" font-size="11" font-weight="bold" fill="#55524b">C · Nhìn từ trên</text><rect x="96.0" y="426.5" width="290.7" height="20.4" fill="#6b4526" stroke="#2a241c" stroke-width="0.9"/><polygon points="96.0,426.5 386.7,426.5 386.7,311.8 96.0,311.8" fill="#7a4f2c" stroke="#2a241c" stroke-width="0.9" stroke-linejoin="round"/><rect x="203.1" y="332.1" width="76.5" height="25.5" fill="#faf9f6" stroke="#2a241c" stroke-width="0.9"/><rect x="219.7" y="311.8" width="43.3" height="20.4" fill="#faf9f6" stroke="#2a241c" stroke-width="0.9"/><polygon points="96.0,316.6 240.6,311.8 240.6,281.1 96.0,281.1" fill="#a9754a" stroke="#2a241c" stroke-width="0.9" stroke-linejoin="round"/><polygon points="242.1,311.8 386.7,316.6 386.7,281.1 242.1,281.1" fill="#a9754