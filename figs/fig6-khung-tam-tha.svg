<svg xmlns="http://www.w3.org/2000/svg" width="940" height="528" viewBox="0 0 940 528" font-family="DejaVu Sans" font-size="11.5"><rect width="100%" height="100%" fill="#faf9f6"/><text x="28" y="32" font-size="15.5" font-weight="bold">HÌNH 6 — Nắp gỗ đặc: khung cocobolo ôm tấm Nu thả trong rãnh</text><text x="28" y="52" fill="#55524b">Chỉ hai thanh đố 34 mm nằm trong chuỗi kích thước bề rộng cánh. Tấm Nu thả tự do trong rãnh nên nở bao nhiêu cũng không đẩy khe ráp giữa.</text><text x="28" y="68" fill="#55524b">Khung dày 18 tại mộng → 12 tại khe giữa; tấm Nu dày đều 8 thụt 3 dưới mặt khung: mặt dưới tự thành khay bỏ bài.</text><rect x="80" y="92" width="220" height="380" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="86" y="107" font-size="11" font-weight="bold" fill="#55524b">A · Mặt bằng một cánh  TL 1:1,16</text><rect x="96.0" y="151.0" width="158.5" height="301.0" fill="#7a3f28" stroke="#2a241c" stroke-width="1.2" /><rect x="125.2" y="176.8" width="100.0" height="249.4" fill="#c8873f" stroke="#2a241c" stroke-width="1.0" /><rect x="120.1" y="171.6" width="110.3" height="259.7" fill="none" stroke="#a8332a" stroke-width="1.0" stroke-dasharray="4,3"/><rect x="92.6" y="375.5" width="3.4" height="37.8" fill="#6b3520" stroke="#2a241c" stroke-width="0.9" /><rect x="92.6" y="298.1" width="3.4" height="37.8" fill="#6b3520" stroke="#2a241c" stroke-width="0.9" /><rect x="92.6" y="220.7" width="3.4" height="37.8" fill="#6b3520" stroke="#2a241c" stroke-width="0.9" /><line x1="96.0" y1="468.0" x2="125.2" y2="468.0" stroke="#55524b" stroke-width="0.8"/><line x1="96.0" y1="465.0" x2="96.0" y2="471.0" stroke="#55524b" stroke-width="0.8"/><line x1="125.2" y1="465.0" x2="125.2" y2="471.0" stroke="#55524b" stroke-width="0.8"/><text x="110.6" y="464.0" text-anchor="middle" font-size="9.5" fill="#55524b">34</text><line x1="125.2" y1="468.0" x2="225.2" y2="468.0" stroke="#55524b" stroke-width="0.8"/><line x1="125.2" y1="465.0" x2="125.2" y2="471.0" stroke