,425 481.4,417.6" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="481.4" cy="417.6" r="2.2" fill="#6b6862"/><text x="908" y="429" text-anchor="end">chỉ chốt 1 điểm ở đúng tâm tấm</text><polyline points="92,490 101.31,490 110.62,400.4" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="110.62" cy="400.4" r="2.2" fill="#6b6862"/><text x="84" y="494" text-anchor="start">Đố dọc 34 gỗ đặc thẳng thớ mang mặt mộng;</text><polyline points="92,506 132.7,506 173.4,374.6" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="173.4" cy="374.6" r="2.2" fill="#6b6862"/><text x="84" y="510" text-anchor="start">tấm Nu THẢ — không nằm trong chuỗi kích thước</text><polyline points="900,146 860.5625,146 821.125,207.0" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="821.125" cy="207.0" r="2.2" fill="#6b6862"/><text x="908" y="150" text-anchor="end">Đố khe giữa — không còn rãnh sống khóa</text><polyline points="900,163 866.5,163 833.0,214.5" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="833.0" cy="214.5" r="2.2" fill="#6b6862"/><text x="908" y="167" text-anchor="end">(gỗ đặc) — không bao giờ vào tấm Nu</text><polyline points="900,242 664.0,242 428.0,229.5" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="428.0" cy="229.5" r="2.2" fill="#6b6862"/><text x="908" y="246" text-anchor="end">Lỗ chốt bản lề Ø6,2 nằm trong đố gỗ đặc</text></svg>