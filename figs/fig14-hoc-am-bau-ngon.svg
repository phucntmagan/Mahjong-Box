 125.76,569 183.52,252.2" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="183.52" cy="252.2" r="2.2" fill="#6b6862"/><text x="60" y="573" text-anchor="start">Hạ bậc bản lề 6.1 × 15 — đây là thứ khoá trần hốc xuống, không phải chọn cho đẹp</text><polyline points="68,586 176.8,586 285.6,434.6" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="285.6" cy="434.6" r="2.2" fill="#6b6862"/><text x="60" y="590" text-anchor="start">Thanh sau 6 chặn đầu ngón; dải gỗ trên hốc 19 cao × 15.9 dày là đường truyền lực khi xách</text></svg>