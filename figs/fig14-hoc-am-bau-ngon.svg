<svg xmlns="http://www.w3.org/2000/svg" width="940" height="604" viewBox="0 0 940 604" font-family="DejaVu Sans" font-size="11.5"><rect width="100%" height="100%" fill="#faf9f6"/><text x="28" y="32" font-size="15.5" font-weight="bold">HÌNH 14 — Trần hốc âm: chỗ ngón tay bấu vào</text><text x="28" y="52" fill="#55524b">Rev C3 bỏ hạ bậc bản lề. Trần hốc thôi lấy cao độ từ vách: nó được nâng vừa đủ để khe hẹp nhất giữa lưng ngón tay và sàn hốc bằng 0.5 mm.</text><text x="28" y="68" fill="#55524b">Khe hở vào tay thành 22.6 mm (Rev C2: 20,0) và bo mép đi từ R4 lên R8 — áp lực lúc bắt lực 357 → 178 kPa. Gỗ đặc trên trần còn 11.3 mm.</text><defs><clipPath id="cg"><rect x="61" y="93" width="372" height="440"/></clipPath></defs><rect x="60" y="92" width="374" height="442" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="66" y="107" font-size="11" font-weight="bold" fill="#55524b">A · Mặt cắt hốc âm, tại một mắt mộng NẮP  TL 6.4:1</text><g clip-path="url(#cg)"><rect x="122.6" y="453.8" width="224.6" height="38.4" fill="#7a4f2c" stroke="#2a241c" stroke-width="1.1" /><rect x="122.6" y="492.2" width="58.2" height="12.8" fill="#2e221a" stroke="#2a241c" stroke-width="0.8" /><polygon points="168.0,453.8 270.4,453.8 270.4,352.1 228.1,359.6 224.9,360.0 221.8,360.3 218.6,360.4 215.4,360.2 212.2,359.9 209.1,359.3 205.9,358.6 202.9,357.7 199.9,356.6 197.0,355.3 194.2,353.8 191.4,352.2 188.8,350.4 186.3,348.4 183.9,346.3 181.7,344.0 179.6,341.6 177.6,339.1 175.8,336.4 174.2,333.7 172.8,330.8 171.5,327.9 170.5,324.9 169.6,321.8 168.9,318.7 168.4,315.5 168.1,312.4 168.0,309.2" fill="#efe7d8" stroke="#c9c3b6" stroke-width="0.8" stroke-linejoin="round" /><polygon points="168.0,309.2 168.0,236.8 168.0,236.8 171.2,236.7 174.4,236.2 177.5,235.4 180.5,234.4 183.4,233.0 186.1,231.3 188.7,229.4 191.1,227.3 193.2,224.9 195.1,222.3 196.8,219.6 198.2,216.7 199.2,213.7 200.0,210.6 200.5,207.4 200.6,204.2 308.8,204.2 308.8,453.8 270.4,453.8 270.4,352.1 228.1,359.6 224.9,36