<svg xmlns="http://www.w3.org/2000/svg" width="940" height="604" viewBox="0 0 940 604" font-family="DejaVu Sans" font-size="11.5"><rect width="100%" height="100%" fill="#faf9f6"/><text x="28" y="32" font-size="15.5" font-weight="bold">HÌNH 14 — Trần hốc âm: chỗ ngón tay bấu vào</text><text x="28" y="52" fill="#55524b">Hạ bậc bản lề lấy hết gỗ trong 6.1 mm ngoài cùng, từ Z32 lên vành. Trần hốc phải nằm dưới dải đó: khe hở vào tay = 47 − 15 − 4 − 8 = 20 mm.</text><text x="28" y="68" fill="#55524b">Trong 20 mm đó, bo mép R4 và dốc 10° chia lại: đốt ngón 15 lọt hết chiều sâu 16, tì lên 18.5 mm bề mặt thay vì bấu một cạnh vuông.</text><defs><clipPath id="cg"><rect x="61" y="93" width="372" height="440"/></clipPath></defs><rect x="60" y="92" width="374" height="442" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="66" y="107" font-size="11" font-weight="bold" fill="#55524b">A · Mặt cắt hốc âm tại giữa hốc  TL 6.4:1</text><g clip-path="url(#cg)"><rect x="151.2" y="453.8" width="192.0" height="38.4" fill="#7a4f2c" stroke="#2a241c" stroke-width="1.1" /><rect x="151.2" y="492.2" width="25.6" height="12.8" fill="#2e221a" stroke="#2a241c" stroke-width="0.8" /><polygon points="164.0,453.8 266.4,453.8 266.4,338.3 194.0,351.0 192.5,351.2 190.9,351.4 189.3,351.4 187.7,351.3 186.1,351.2 184.5,350.9 183.0,350.5 181.4,350.1 180.0,349.5 178.5,348.9 177.1,348.1 175.7,347.3 174.4,346.4 173.1,345.4 172.0,344.3 170.8,343.2 169.8,342.0 168.8,340.7 167.9,339.4 167.1,338.0 166.4,336.6 165.8,335.2 165.2,333.7 164.8,332.1 164.4,330.6 164.2,329.0 164.0,327.4 164.0,325.8" fill="#efe7d8" stroke="#c9c3b6" stroke-width="0.8" stroke-linejoin="round" /><polygon points="164.0,325.8 164.0,300.2 203.0,300.2 203.0,204.2 304.8,204.2 304.8,453.8 266.4,453.8 266.4,338.3 194.0,351.0 192.5,351.2 190.9,351.4 189.3,351.4 187.7,351.3 186.1,351.2 184.5,350.9 183.0,350.5 181.4,350.1 180.0,349.5 178.5,348.9 177.1,348.1 175.7,347.3 174.4,346.4 173.1,345.4 172.0,344.3 170.8,343.2 169.8,34