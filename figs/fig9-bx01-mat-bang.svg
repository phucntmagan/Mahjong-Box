t="bold" fill="#a8332a">5</text><line x1="319.0" y1="116.0" x2="319.0" y2="434.5" stroke="#a8332a" stroke-width="0.8"/><circle cx="319.0" cy="434.5" r="2" fill="#a8332a"/><circle cx="319.0" cy="116.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="319.0" y="119.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">6</text><line x1="336.5" y1="604.0" x2="336.5" y2="317.0" stroke="#a8332a" stroke-width="0.8"/><circle cx="336.5" cy="317.0" r="2" fill="#a8332a"/><circle cx="336.5" cy="604.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="336.5" y="607.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">7</text><line x1="276.0" y1="116.0" x2="276.0" y2="255.0" stroke="#a8332a" stroke-width="0.8"/><circle cx="276.0" cy="255.0" r="2" fill="#a8332a"/><circle cx="276.0" cy="116.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="276.0" y="119.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">8</text><line x1="96.0" y1="195.5" x2="135.0" y2="195.5" stroke="#a8332a" stroke-width="0.8"/><circle cx="135.0" cy="195.5" r="2" fill="#a8332a"/><circle cx="96.0" cy="195.5" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="96.0" y="199.1" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">9</text><line x1="271.0" y1="604.0" x2="271.0" y2="522.5" stroke="#a8332a" stroke-width="0.8"/><circle cx="271.0" cy="522.5" r="2" fill="#a8332a"/><circle cx="271.0" cy="604.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="271.0" y="607.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">10</text><rect x="572" y="92" width="588" height="520" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="578" y="107" font-size="11" font-weight="bold" fill="#55524b">CHU GIAI</text><circle cx="590.0" cy="122.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="590.0" y="125.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">1</text><text x="608" y="126" font-size="10.5">Truc xoay nam DUNG tren arris: X = 0 (mat ngoai vach) va Z47 (vanh</text><text x="608" y="140" font-size="10.5">than). Doi xung hai ben.</text><circle cx="590.0" cy="162.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="590.0" y="165.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">2</text><text x="608" y="166" font-size="10.5">3 ban le la brass 40 x 14 x 1.8 moi ben, tam Y = 98, 185, 272.</text><text x="608" y="180" font-size="10.5">Mortise sau 0.9 vao vanh than.</text><circle cx="590.0" cy="202.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="590.0" y="205.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">3</text><text x="608" y="206" font-size="10.5">Hoc am hai tay 120 x 28 sau 12, Y 115..235, nam gon trong vach ban</text><text x="608" y="220" font-size="10.5">le 18 — khong noi go ra ngoai.</text><circle cx="590.0" cy="242.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="590.0" y="245.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">4</text><text x="608" y="246" font-size="10.5">Khe luon ngon nhac khay: hoc 50 x sau 6 vao vach truoc/sau.</text><circle cx="590.0" cy="268.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="590.0" y="271.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">5</text><text x="608" y="272" font-size="10.5">Khoet xuyen mat dau khay 50 x cao 12 — mo moc ngon.</text><circle cx="590.0" cy="294.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="590.0" y="297.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">6</text><text x="608" y="298" font-size="10.5">Hom ngon O25 sau 12, hai ben ranh Joker, khoet suot chieu sau.</text><circle cx="590.0" cy="320.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="590.0" y="323.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">7</text><text x="608" y="324" font-size="10.5">4 o xuc xac 18 x 18 sau 18, vach 5.</text><circle cx="590.0" cy="346.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="590.0" y="349.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">8</text><text x="608" y="350" font-size="10.5">Vach ngan 6, cao toi vanh tai chinh vi tri no.</text><circle cx="590.0" cy="372.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="590.0" y="375.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">9</text><text x="608" y="376" font-size="10.5">Vach ban le 18 — dinh ra boi hoc am: sau 12 + thanh sau 6. Ban le</text><text x="608" y="390" font-size="10.5">chi an 0.9 mm.</text><circle cx="590.0" cy="412.0" r="8.5" fill="#fff" stroke="#a8332a" stroke-width="1.3"/><text x="590.0" y="415.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8332a">10</text><text x="608" y="416" font-size="10.5">Hoc nam cham khoa nap 20.2 x 5.2 x sau 5.2, 8 cai tren than (va 8</text><text x="608" y="430" font-size="10.5">doi ung tren nap). Vi tri +/-0,2.</text><text x="590" y="458" font-size="11" font-weight="bold">CHUAN</text><rect x="581" y="465" width="18" height="18" fill="#fff" stroke="#2a241c" stroke-width="1.2"/><text x="590" y="478" text-anchor="middle" font-size="11" font-weight="bold">A</text><text x="608" y="478" font-size="10.5" fill="#55524b">MAT DAY NGOAI cua than (truoc khi dan chan dem). Chuan Z. Moi cao do</text><text x="608" y="492" font-size="10.5" fill="#55524b">trong ho so deu do tu day, KHONG do tu vanh.</text><rect x="581" y="503" width="18" height="18" fill="#fff" stroke="#2a241c" stroke-width="1.2"/><text x="590" y="516" text-anchor="middle" font-size="11" font-weight="bold">B</text><text x="608" y="516" font-size="10.5" fill="#55524b">MAT NGOAI VACH BAN LE TRAI. Chuan X. Chon mat nay vi TRUC XOAY BAN</text><text x="608" y="530" font-size="10.5" fill="#55524b">LE NAM DUNG TREN NO (X = 0): moi sai lech cua mat nay di thang vao</text><text x="608" y="544" font-size="10.5" fill="#55524b">vi tri truc, nen no phai la chuan chu khong phai kich thuoc suy ra.</text><rect x="581" y="555" width="18" height="18" fill="#fff" stroke="#2a241c" stroke-width="1.2"/><text x="590" y="568" text-anchor="middle" font-size="11" font-weight="bold">C</text><text x="608" y="568" font-size="10.5" fill="#55524b">MAT NGOAI VACH TRUOC (mat vach goc, KHONG phai mat go noi cua hoc</text><text x="608" y="582" font-size="10.5" fill="#55524b">am). Chuan Y. Go noi hoc am la chi tiet noi len, khong duoc lam</text><text x="608" y="596" font-size="10.5" fill="#55524b">chuan.</text></svg>