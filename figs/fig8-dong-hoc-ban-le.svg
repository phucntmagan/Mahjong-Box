62" stroke-width="0.9"/><circle cx="241.4" cy="311.35" r="2.2" fill="#6b6862"/><text x="60" y="396" text-anchor="start">Trục xoay P = (0 , 47) — arris ngoài trên của thân</text><polyline points="68,409 183.2,409 298.4,304.225" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="298.4" cy="304.225" r="2.2" fill="#6b6862"/><text x="60" y="413" text-anchor="start">Bản lề lá brass 40×14×1.8, khớp Ø4.5 — không ống gỗ, không mắt mộng</text><polyline points="68,426 111.0,426 154.0,318.475" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="154.0" cy="318.475" r="2.2" fill="#6b6862"/><text x="60" y="430" text-anchor="start">Cánh mở nằm ngang, mặt trên phẳng tại Z47 = đúng vành thân</text><polyline points="68,443 152.8,443 237.6,318.475" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="237.6" cy="318.475" r="2.2" fill="#6b6862"/><text x="60" y="447" text-anchor="start">Chặn 180° = mặt cạnh nắp (12.75×350 mm) áp vào mặt ngoài vách</text><polyline points="900,392 813.0,392 726,203" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="726" cy="203" r="2.2" fill="#6b6862"/><text x="908" y="396" text-anchor="end">Bo lượn R2.25 hai cạnh arris → khép thành lỗ Ø4.5 ôm khớp brass</text><polyline points="900,409 733.0,409 566,203" fill="none" stroke="#6b6862" stroke-width="0.9"/><circle cx="566" cy="203" r="2.2" fill="#6b6862"/><text x="908" y="413" text-anchor="end">Ống gỗ Ø15 của bản trước là HỆ QUẢ của chỗ đặt trục</text></svg>