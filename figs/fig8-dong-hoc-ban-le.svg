<svg xmlns="http://www.w3.org/2000/svg" width="940" height="486" viewBox="0 0 940 486" font-family="DejaVu Sans" font-size="11.5"><rect width="100%" height="100%" fill="#faf9f6"/><text x="28" y="32" font-size="15.5" font-weight="bold">HÌNH 8 — Bản lề: trục ở ARRIS, không phải ở giữa bề dày nắp</text><text x="28" y="52" fill="#55524b">Trục cắm vào giữa bề dày nắp thì hai góc đầu cánh quét vòng tròn xuyên qua vành thân → buộc phải bo mũi tròn R = ½ bề dày. Ống gỗ Ø15 là hệ quả.</text><text x="28" y="68" fill="#55524b">Đưa trục ra arris — góc chung của cả hai chi tiết — thì bán kính quét bằng 0. Bề dày nắp 15 mm không còn ràng buộc gì tới bản lề.</text><defs><clipPath id="ca"><rect x="61" y="93" width="402" height="272"/></clipPath><clipPath id="cb"><rect x="485" y="93" width="414" height="272"/></clipPath></defs><rect x="60" y="92" width="404" height="274" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="66" y="107" font-size="11" font-weight="bold" fill="#55524b">A · Hành trình 0 → 180°  TL 1:1,05</text><g clip-path="url(#ca)"><line x1="75.2" y1="356.0" x2="431.4" y2="356.0" stroke="#1a1a1a" stroke-width="2"/><text x="76.10000000000002" y="351.0" font-size="9.5" fill="#8a857c">mặt bàn</text><rect x="241.4" y="346.5" width="190.0" height="7.6" fill="#5c3d24" stroke="#2a241c" stroke-width="0.9" /><rect x="241.4" y="311.4" width="17.1" height="35.1" fill="#7a4f2c" stroke="#2a241c" stroke-width="1.1" /><rect x="258.5" y="310.4" width="172.9" height="36.1" fill="#c2ab84" stroke="#2a241c" stroke-width="0.8" /><text x="347.8" y="334.15" text-anchor="middle" font-size="9" fill="#5a4a32">khay</text><path d="M 416.4,297.1 L 415.5,288.0 L 414.0,278.9 L 412.1,269.9 L 409.6,261.0 L 406.8,252.3 L 403.5,243.7 L 399.7,235.3 L 395.5,227.1 L 390.9,219.2 L 385.9,211.5 L 380.4,204.1 L 374.6,196.9 L 368.5,190.1 L 361.9,183.6 L 355.1,177.5 L 347.9,171.7 L 340.5,166.4 L 332.8,161.4 L 324.8,156.8 L 316.6,152.6 L 308.2,148.9 L 299.6,145.6 L 290.8,142.8 L 281.9,1