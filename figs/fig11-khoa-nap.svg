<svg xmlns="http://www.w3.org/2000/svg" width="980" height="572" viewBox="0 0 980 572" font-family="DejaVu Sans" font-size="11.5"><rect width="100%" height="100%" fill="#faf9f6"/><text x="28" y="32" font-size="15.5" font-weight="bold">HÌNH 11 — Khóa nắp: vì sao phải nối NẮP với THÂN, và chặn đúng một phương</text><text x="28" y="52" fill="#55524b">Trục chốt P = (6 , 47), mép khe ráp giữa cách trục 176.7 mm. Mép khe đi gần như thẳng đứng lên: tỉ lệ dọc/ngang 11.7 : 1.</text><text x="28" y="68" fill="#55524b">Hai cánh cùng mở thì hai mép khe nâng bằng nhau và chỉ tách nhau — mọi khóa nối cánh với cánh đều tuột ra.</text><rect x="56" y="92" width="600" height="250" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="62" y="107" font-size="11" font-weight="bold" fill="#55524b">A · Vi sao khoa noi CANH voi CANH khong dung duoc  —  TL 1,5:1</text><rect x="80.0" y="249.5" width="567.0" height="58.5" fill="#8a5a33" stroke="#2a241c" stroke-width="1.1" /><rect x="80.0" y="249.5" width="33.0" height="58.5" fill="#7a4f2c" stroke="#2a241c" stroke-width="1.1" /><rect x="614.0" y="249.5" width="33.0" height="58.5" fill="#7a4f2c" stroke="#2a241c" stroke-width="1.1" /><polygon points="89.2,249.5 359.1,207.5 355.7,185.2 85.7,227.3" fill="#d8c3a5" stroke="#a8332a" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="5,3"/><polygon points="637.8,249.5 367.9,207.5 371.3,185.2 641.3,227.3" fill="#d8c3a5" stroke="#a8332a" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="5,3"/><polygon points="89.2,249.5 362.4,249.5 362.4,227.0 89.2,227.0" fill="#a9754a" stroke="#2a241c" stroke-width="1.1" stroke-linejoin="round" /><polygon points="637.8,249.5 364.6,249.5 364.6,227.0 637.8,227.0" fill="#a9754a" stroke="#2a241c" stroke-width="1.1" stroke-linejoin="round" /><circle cx="89.2" cy="249.5" r="9.1" fill="#a9754a" stroke="#2a241c" stroke-width="1.1"/><circle cx="637.8" cy="249.5" r="9.1" fill="#a9754a" stroke="#2a241c" stroke-width="1.1"/><rect x="342.5" y="235.8" width="42.0" height="4.8" fill="#c9a227" stroke="#2a241c" stroke-width="0.9" /><rect x="327.3" y="195.4" width="21.0" height="4.8" fill="#c9a227" stroke="#a8332a" stroke-width="1.0" /><rect x="378.7" y="195.4" width="21.0" height="4.8" fill="#c9a227" stroke="#a8332a" stroke-width="1.0" /><line x1="348.3" y1="187.8" x2="378.7" y2="187.8" stroke="#a8332a" stroke-width="0.8"/><line x1="348.3" y1="184.8" x2="348.3" y2="190.8" stroke="#a8332a" stroke-width="0.8"/><line x1="378.7" y1="184.8" x2="378.7" y2="190.8" stroke="#a8332a" stroke-width="0.8"/><text x="363.5" y="183.8" text-anchor="middle" font-size="9.5" fill="#a8332a">tach 20.2 — chot 6.5 da tuot</text><line x1="237.5" y1="227.0" x2="237.5" y2="185.2" stroke="#a8332a" stroke-width="1.6" stroke-linecap="round"/><polygon points="237.5,185.2 239.9,190.7 235.1,190.7" fill="#a8332a"/><text x="231.5" y="209.11567612425574" font-size="9.5" fill="#a8332a" text-anchor="end">venh len 28</text><text x="356" y="330" font-size="9.5" fill="#a8332a" text-anchor="middle">ca HAI canh cung mo 8.9° — day la truong hop lat up hop</text><text x="89.0" y="221.0" font-size="9" fill="#55524b">canh nap khi DONG</text><text x="105.15" y="253.5" font-size="9" fill="#2f7a3c">P = (6 , 47)</text><rect x="672" y="92" width="284" height="250" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="678" y="107" font-size="11" font-weight="bold" fill="#55524b"></text><text x="684" y="110" font-size="11" font-weight="bold" fill="#55524b">C · Mat cat qua mot cap nam cham</text><text x="684" y="124" font-size="9.5" fill="#55524b">TL 4.6:1</text><rect x="755.0" y="230.0" width="46.0" height="46.0" fill="#7a4f2c" stroke="#2a241c" stroke-width="1.3" /><rect x="755.0" y="161.0" width="119.6" height="69.0" fill="#a9754a" stroke="#2a241c" stroke-width="1.3" /><rect x="768.8" y="230.0" width="23.0" height="23.9" fill="#2f5d9e" stroke="#1a3a66" stroke-width="1.2" /><rect x="768.8" y="206.1" width="23.0" height="23.9" fill="#2f5d9e" stroke="#1a3a66" stroke-width="1.2" /><path d="M 745.8,230.0 L 883.8,230.0" fill="none" stroke="#2f7a3c" stroke-width="1.1" stroke-dasharray="5,3"/><text x="887.8" y="198.5" font-size="9" fill="#55524b">nap 15.0</text><text x="887.8" y="256.0" font-size="9" fill="#2f7a3c">vanh Z47.0</text><line x1="780.3" y1="183.1" x2="780.3" y2="227.7" stroke="#2f5d9e" stroke-width="1.8" stroke-linecap="round"/><polygon points="780.3,227.7 778.3,223.1 782.3,223.1" fill="#2f5d9e"/><line x1="780.3" y1="276.9" x2="780.3" y2="232.3" stroke="#2f5d9e" stroke-width="1.8" stroke-linecap="round"/><polygon points="780.3,232.3 782.3,236.9 778.3,236.9" fill="#2f5d9e"/><text x="684" y="296" font-size="9" fill="#2f5d9e">hut theo phuong Z — huong manh nhat cua nam cham</text><text x="684" y="309" font-size="9" fill="#55524b">go con 3.0 ra mep nap, 2.0 vao long hop</text><text x="684" y="322" font-size="9" fill="#2f5d9e">tu do theo X: gian no theo mua 1.09 mm chi lam</text><text x="684" y="335" font-size="9" fill="#2f5d9e">lech 5 % be mat, gan nhu khong doi luc hut</text><rect x="56" y="362" width="900" height="190" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="62" y="377" font-size="11" font-weight="bold" fill="#55524b">B · Bo tri nam cham — nhin tu tren, dai mep truoc.  TL 1,5:1</text><rect x="80.0" y="449.0" width="567.0" height="51.0" fill="#efe9dd" stroke="#cfccc5" stroke-width="0.8" /><rect x="80.0" y="500.0" width="567.0" height="0.0" fill="#e2d7c4" stroke="#cfccc5" stroke-width="0.8" /><rect x="80.0" y="485.0" width="567.0" height="15.0" fill="#7a4f2c" stroke="#2a241c" stroke-width="1.1" /><path d="M 363.5,507.5 L 363.5,443.0" fill="none" stroke="#2a241c" stroke-width="1.0" stroke-dasharray="7,4"/><text x="363.5" y="439.0" font-size="9" fill="#55524b" text-anchor="middle">khe rap giua</text><rect x="248.0" y="488.0" width="30.0" height="7.5" fill="#2f5d9e" stroke="#1a3a66" stroke-width="1.1" /><text x="263.0" y="478.25" font-size="8.5" fill="#2f5d9e" text-anchor="middle">122</text><rect x="281.0" y="488.0" width="30.0" height="7.5" fill="#2f5d9e" stroke="#1a3a66" stroke-width="1.1" /><text x="296.0" y="478.25" font-size="8.5" fill="#2f5d9e" text-anchor="middle">144</text><rect x="449.0" y="488.0" width="30.0" height="7.5" fill="#2f5d9e" stroke="#1a3a66" stroke-width="1.1" /><text x="464.0" y="478.25" font-size="8.5" fill="#2f5d9e" text-anchor="middle">256</text><rect x="416.0" y="488.0" width="30.0" height="7.5" fill="#2f5d9e" stroke="#1a3a66" stroke-width="1.1" /><text x="431.0" y="478.25" font-size="8.5" fill="#2f5d9e" text-anchor="middle">234</text><line x1="80.0" y1="526.0" x2="647.0" y2="526.0" stroke="#55524b" stroke-width="0.8"/><line x1="80.0" y1="523.0" x2="80.0" y2="529.0" stroke="#55524b" stroke-width="0.8"/><line x1="647.0" y1="523.0" x2="647.0" y2="529.0" stroke="#55524b" stroke-width="0.8"/><text x="363.5" y="522.0" text-anchor="middle" font-size="9.5" fill="#55524b">378</text><text x="657.0" y="487.75" font-size="9" fill="#2f5d9e">nam cham 20 x 5 x 5</text><text x="657.0" y="501.75" font-size="9" fill="#55524b">dai chong nhau nap/vanh 10 mm</text><text x="86.0" y="467.0" font-size="8.5" fill="#55524b">long hop</text></svg>