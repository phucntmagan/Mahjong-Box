<svg xmlns="http://www.w3.org/2000/svg" width="980" height="572" viewBox="0 0 980 572" font-family="DejaVu Sans" font-size="11.5"><rect width="100%" height="100%" fill="#faf9f6"/><text x="28" y="32" font-size="15.5" font-weight="bold">HÌNH 11 — Khóa nắp: vì sao phải nối NẮP với THÂN, và chặn đúng một phương</text><text x="28" y="52" fill="#55524b">Trục chốt P = (6 , 53), mép khe ráp giữa cách trục 178.4 mm. Mép khe đi gần như thẳng đứng lên: tỉ lệ dọc/ngang 29.7 : 1.</text><text x="28" y="68" fill="#55524b">Hai cánh cùng mở thì hai mép khe nâng bằng nhau và chỉ tách nhau — mọi khóa nối cánh với cánh đều tuột ra.</text><rect x="56" y="92" width="600" height="250" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="62" y="107" font-size="11" font-weight="bold" fill="#55524b">A · Vi sao khoa noi CANH voi CANH khong dung duoc  —  TL 1,5:1</text><rect x="80.0" y="249.5" width="555.0" height="58.5" fill="#8a5a33" stroke="#2a241c" stroke-width="1.1" /><rect x="80.0" y="249.5" width="27.0" height="58.5" fill="#7a4f2c" stroke="#2a241c" stroke-width="1.1" /><rect x="608.0" y="249.5" width="27.0" height="58.5" fill="#7a4f2c" stroke="#2a241c" stroke-width="1.1" /><polygon points="99.5,247.6 353.2,198.5 349.8,180.8 96.1,230.0" fill="#d8c3a5" stroke="#a8332a" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="5,3"/><polygon points="615.5,247.6 361.8,198.5 365.2,180.8 618.9,230.0" fill="#d8c3a5" stroke="#a8332a" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="5,3"/><polygon points="98.0,249.5 356.4,249.5 356.4,231.5 98.0,231.5" fill="#a9754a" stroke="#2a241c" stroke-width="1.1" stroke-linejoin="round" /><polygon points="617.0,249.5 358.6,249.5 358.6,231.5 617.0,231.5" fill="#a9754a" stroke="#2a241c" stroke-width="1.1" stroke-linejoin="round" /><circle cx="89.0" cy="240.5" r="9.0" fill="none" stroke="#2f7a3c" stroke-width="1.0"/><circle cx="89.0" cy="240.5" r="3.2" fill="#1a1208" stroke="#2a241c" stroke-width="0.9"/><circle cx="626.