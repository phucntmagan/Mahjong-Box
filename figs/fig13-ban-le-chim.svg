<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="DejaVu Sans" font-size="11.5"><rect width="100%" height="100%" fill="#faf9f6"/><text x="28" y="32" font-size="15.5" font-weight="bold">HÌNH 13 — Vì sao bản lề chìm hẳn trong gỗ không quay được</text><text x="28" y="52" fill="#55524b">Cánh nắp là vật rắn quay quanh MỘT trục: mọi điểm nằm phía ngoài trục đều đi xuống khi mở. Trục lùi vào bao nhiêu thì dải "đi xuống" rộng bấy nhiêu.</text><text x="28" y="68" fill="#55524b">Dải đó luôn bắt đầu từ mặt ngoài vách, nên nó luôn mở thẳng ra ngoài. Đẩy trục vào trong chỉ ĐỔI CHỖ cái nhìn thấy — tổng vẫn là 6.1 mm.</text><defs><clipPath id="ca"><rect x="61" y="93" width="402" height="292"/></clipPath></defs><rect x="60" y="92" width="404" height="294" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="66" y="107" font-size="11" font-weight="bold" fill="#55524b">A · Trục chìm hẳn: lùi vào 11, sâu 9 dưới vành  TL 6.4:1</text><g clip-path="url(#ca)"><rect x="168.0" y="214.0" width="140.8" height="128.0" fill="#7a4f2c" stroke="#2a241c" stroke-width="1.2" /><rect x="168.0" y="214.0" width="12.8" height="128.0" fill="#c9a227" stroke="#6b5410" stroke-width="1.1" /><rect x="168.0" y="118.0" width="166.4" height="96.0" fill="#a9754a" stroke="#2a241c" stroke-width="1.3" /><polygon points="168.0,214.0 163.7,219.7 159.9,225.7 156.5,232.0 153.6,238.6 151.3,245.3 149.5,252.2 148.3,259.3 147.6,266.4 147.5,273.5 147.9,280.7 148.9,287.7 150.4,294.7 152.5,301.5 155.1,308.2 158.2,314.6 161.9,320.8 166.0,326.6 170.5,332.1 175.5,337.3 180.8,342.0 186.5,346.3 192.5,350.1 198.8,353.5 205.4,356.4 212.1,358.7 219.0,360.5 226.1,361.7 233.2,362.4 240.3,362.5 247.5,362.1 254.5,361.1 261.5,359.6 268.3,357.5 275.0,354.9 281.4,351.8 287.6,348.1 293.4,344.0 298.9,339.5 304.1,334.5 308.8,329.2 283.0,308.1 280.0,311.5 276.7,314.6 273.2,317.5 269.5,320.1 265.6,322.4 261.6,324.3 257.4,326.0 253.0,327.3 248.6,328.3 244.1,328.9 239.6,329.2 235.1,329.1 230.6,328.7 226.1,327.9 221.8,326.7 217.5,325.3 213.3,323.5 209.3,321.3 205.5,318.9 201.9,316.2 198.5,313.2 195.4,309.9 192.5,306.4 189.9,302.7 187.6,298.8 185.7,294.8 184.0,290.6 182.7,286.2 181.7,281.8 181.1,277.3 180.8,272.8 180.9,268.3 181.3,263.8 182.1,259.3 183.3,255.0 184.7,250.7 186.5,246.5 188.7,242.5 191.1,238.7 193.8,235.1" fill="#a8332a" stroke="#7a2018" stroke-width="1.0" stroke-linejoin="round" fill-opacity="0.55"/><circle cx="238.4" cy="271.6" r="39.0" fill="#a9754a" stroke="#2a241c" stroke-width="1.3"/><circle cx="238.4" cy="271.6" r="19.8" fill="#1a1208" stroke="#1a1208" stroke-width="0.6"/><path d="M 116.8,214.0 L 328.0,214.0" fill="none" stroke="#2f7a3c" stroke-width="1.0" stroke-dasharray="5,3"/><line x1="168.0" y1="358.0" x2="180.8" y2="358.0" stroke="#55524b" stroke-width="0.8"/><line x1="168.0" y1="355.0" x2="168.0" y2="361.0" stroke="#55524b" stroke-width="0.8"/><line x1="180.8" y1="355.0" x2="180.8" y2="361.0" stroke="#55524b" stroke-width="0.8"/><text x="174.4" y="354.0" text-anchor="middle" font-size="8.5" fill="#55524b">da 2</text></g><text x="72" y="356" font-size="10" fill="#a8332a">Vùng đỏ = gỗ PHẢI BỐC đi để cánh quay. Nó cày thẳng qua lớp da gỗ</text><text x="72" y="370" font-size="10" fill="#a8332a">và mở thông ra mặt ngoài. Va chạm ở 0,25° — cánh gần như không nhúc nhích.</text><rect x="484" y="92" width="416" height="294" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="5,4"/><text x="490" y="107" font-size="11" font-weight="bold" fill="#55524b">B · Đẩy trục vào sâu bao nhiêu thì được gì</text><text x="692" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#55524b">Tổng "nhìn thấy" luôn = bán kính ống = 6.1 mm.</text><text x="552" y="177" text-anchor="end" font-size="9.5" fill="#55524b">lùi vào 0.0</text><rect x="560.0" y="160" width="113.0" height="26" fill="#c07a12" stroke="#8a5608" stroke-width="1"/><text x="616.4814814814815" y="177" text-anchor="middle" font-size="9.5" fill="#fff">6.1</text><text x="680.9629629629629" y="177" font-size="10" font-weight="bold" fill="#55524b">HỌ B</text><text x="552" y="215" text-anchor="end" font-size="9.5" fill="#55524b">lùi vào 2.0</text><rect x="560.0" y="198" width="75.9" height="26" fill="#c07a12" stroke="#8a5608" stroke-width="1"/><text x="597.9629629629629" y="215" text-anchor="middle" font-size="9.5" fill="#fff">4.1</text><rect x="635.9" y="198" width="37.0" height="26" fill="#a8332a" stroke="#7a2018" stroke-width="1"/><text x="654.4444444444443" y="215" text-anchor="middle" font-size="9.5" fill="#fff">2.0</text><text x="552" y="253" text-anchor="end" font-size="9.5" fill="#55524b">lùi vào 4.0</text><rect x="560.0" y="236" width="38.9" height="26" fill="#c07a12" stroke="#8a5608" stroke-width="1"/><text x="579.4444444444445" y="253" text-anchor="middle" font-size="9.5" fill="#fff">2.1</text><rect x="598.9" y="236" width="74.1" height="26" fill="#a8332a" stroke="#7a2018" stroke-width="1"/><text x="635.925925925926" y="253" text-anchor="middle" font-size="9.5" fill="#fff">4.0</text><text x="552" y="291" text-anchor="end" font-size="9.5" fill="#55524b">lùi vào 6.1</text><rect x="560.0" y="274" width="113.0" height="26" fill="#a8332a" stroke="#7a2018" stroke-width="1"/><text x="616.4814814814815" y="291" text-anchor="middle" font-size="9.5" fill="#fff">6.1</text><text x="680.9629629629629" y="291" font-size="10" font-weight="bold" fill="#2f7a3c">HỌ C</text><text x="552" y="329" text-anchor="end" font-size="9.5" fill="#55524b">lùi vào 8.0</text><rect x="560.0" y="312" width="148.1" height="26" fill="#a8332a" stroke="#7a2018" stroke-width="1"/><text x="634.0740740740741" y="329" text-anchor="middle" font-size="9.5" fill="#fff">8.0</text><text x="552" y="367" text-anchor="end" font-size="9.5" fill="#55524b">lùi vào 11.0</text><rect x="560.0" y="350" width="203.7" height="26" fill="#a8332a" stroke="#7a2018" stroke-width="1"/><text x="661.8518518518518" y="367" text-anchor="middle" font-size="9.5" fill="#fff">11.0</text><line x1="673.0" y1="148" x2="673.0" y2="388.0" stroke="#2f7a3c" stroke-width="1.4" stroke-dasharray="5,4"/><text x="676.9629629629629" y="144" font-size="9.5" fill="#2f7a3c">6.1</text><rect x="520" y="374" width="13" height="11" fill="#c07a12"/><text x="538" y="384" font-size="9.5" fill="#55524b">ống nhô ra ngoài mặt vách</text><rect x="700" y="374" width="13" height="11" fill="#a8332a"/><text x="718" y="384" font-size="9.5" fill="#55524b">khe hở bắt buộc trên mặt vách</text></svg>